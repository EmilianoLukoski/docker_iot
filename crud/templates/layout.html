<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <title>FLASK CRUD 1.6</title>
  <link rel="stylesheet" href="https://bootswatch.com/5/darkly/bootstrap.min.css" id="theme-css">
  <style>
    .light-theme {
      --bs-body-bg: #ffffff;
      --bs-body-color: #212529;
      --bs-primary: #375a7f;
      --bs-secondary: #444444;
      --bs-success: #00bc8c;
      --bs-info: #3498db;
      --bs-warning: #f39c12;
      --bs-danger: #e74c3c;
      --bs-light: #f8f9fa;
      --bs-dark: #222222;
    }
    .light-theme .navbar {
      background-color: var(--bs-primary) !important;
    }
    .light-theme .btn-outline-light {
      color: #fff;
      border-color: #fff;
    }
    .light-theme .btn-outline-light:hover {
      background-color: #fff;
      color: var(--bs-primary);
    }
    .light-theme .table {
      color: var(--bs-body-color);
    }
    .light-theme .card {
      background-color: #fff;
      color: var(--bs-body-color);
    }
    .light-theme .form-control {
      background-color: #fff;
      color: var(--bs-body-color);
      border-color: #ced4da;
    }
    .light-theme .form-control:focus {
      background-color: #fff;
      color: var(--bs-body-color);
    }
  </style>
  {% with messages = get_flashed_messages() %} {% if messages %}
  {% for message in messages %}
  <div class="alert alert-success alert-dismissible fade show" role="alert">
    <strong>{{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  {% endfor %}
  {% endif %} {% endwith %}
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">CRUD</a>
      <div class="d-flex align-items-center">
        {% if session.get("user_id") %}
        <button id="theme-toggle" class="btn btn-outline-light me-3">
          <i class="bi bi-sun-fill"></i>
        </button>
        <div class="nav-item pe-3 pt-2">{{ session.get("user_id") }}</div>
        <a href="{{url_for('logout')}}" class="btn btn-secondary my-2 my-sm-0" type="submit">Salir</a>
        {% endif %}
      </div>
    </div>
  </nav>
</head>

<body>
  <div class="container pt-4">
    {% block body %}
    {% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" 
          integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" 
          crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="{{url_for('static', filename='js/main.js')}}"></script>
</body>
</html>
